---
# CF and NUG global attributes relevant for dataset discovery.
# `also_in_acdd` distinguishes attributes that are also part of ACDD 1.3.
Conventions:
  description: A comma-separated list of the conventions followed by the dataset, for example "CF-1.10, ACDD-1.3".
  format: text
  requirement_level: Required
  also_in_acdd: true

history:
  description: Provides an audit trail for modifications to the original data and should be appended to as the dataset changes.
  format: text
  requirement_level: Required
  also_in_acdd: true

comment:
  description: Miscellaneous information about the data or methods used to produce it.
  format: text
  requirement_level: Not required
  also_in_acdd: true

featureType:
  description: Specifies the CF discrete sampling geometry represented by the file. Use one of the feature types defined by the CF conventions when applicable.
  format: text
  requirement_level: Recommended when applicable
  also_in_acdd: false
  options:
    - point
    - timeSeries
    - trajectory
    - profile
    - timeSeriesProfile
    - trajectoryProfile

external_variables:
  description: Identifies variables referenced by cell_measures attributes that are not present in the file.
  format: text
  requirement_level: Not required
  also_in_acdd: false
